<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Stats</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg: #11100e;
    --bg-card: #1d1a16;
    --bg-card-2: #241f18;
    --line: #393026;
    --text: #f2ebde;
    --text-dim: #ab9f90;
    --text-faint: #706658;
    --accent: #d49441;
    --done: #7da276;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at top, rgba(212,148,65,0.12), transparent 34%),
      linear-gradient(180deg, #12100e 0%, #11100e 100%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    padding:20px 14px 32px;
  }

  .wrap{
    width:min(780px, 100%);
    margin:0 auto;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:18px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
  }

  h1{
    font-family:'Oswald', sans-serif;
    font-size:34px;
    line-height:0.95;
    text-transform:uppercase;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 12px;
    color:var(--text-dim);
    text-decoration:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  .back-link:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  .hero,
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:18px;
  }

  .hero{
    padding:16px;
    margin-bottom:14px;
  }

  .metrics{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
    margin-top:12px;
  }

  .metric{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
  }

  .metric-label,
  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .metric-value{
    margin-top:8px;
    font-family:'Oswald', sans-serif;
    font-size:28px;
    line-height:1;
    text-transform:uppercase;
  }

  .section{
    margin-top:16px;
  }

  .section-title{
    margin-bottom:10px;
    font-family:'Oswald', sans-serif;
    font-size:20px;
    text-transform:uppercase;
  }

  .stack{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .card{
    padding:14px;
  }

  .day-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }

  .day-name{
    font-family:'Oswald', sans-serif;
    font-size:18px;
    text-transform:uppercase;
  }

  .day-focus,
  .card-copy{
    margin-top:5px;
    color:var(--text-dim);
    font-size:13px;
    line-height:1.45;
  }

  .pill-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 10px;
    background:var(--bg-card-2);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
  }

  .pill strong{
    color:var(--accent);
    margin-right:6px;
  }

  .bar{
    margin-top:12px;
    height:8px;
    border-radius:999px;
    background:var(--bg-card-2);
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--done), #a5c497);
    width:0%;
  }

  @media (min-width: 720px){
    .metrics{
      grid-template-columns:repeat(4, minmax(0, 1fr));
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="eyebrow">Current Browser State</div>
      <h1>Weekly Stats</h1>
    </div>
    <a class="back-link" href="./workout-log.html">Back To Log</a>
  </header>

  <section class="hero">
    <div class="section-label">Snapshot</div>
    <div class="metrics" id="metrics"></div>
  </section>

  <section class="section">
    <div class="section-title">Days</div>
    <div class="stack" id="dayStats"></div>
  </section>

  <section class="section">
    <div class="section-title">Conditioning</div>
    <div class="stack" id="conditioningStats"></div>
  </section>
</div>

<script src="./workout-log/data.js"></script>
<script src="./workout-log/stats.js"></script>
</body>
</html>
