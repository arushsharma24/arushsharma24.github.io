<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg: #13110f;
    --bg-elevated: #1b1814;
    --bg-card: #201c17;
    --bg-card-2: #262119;
    --line: #383127;
    --line-strong: #4b4030;
    --text: #f1eadc;
    --text-dim: #a89e8e;
    --text-faint: #72685b;
    --accent: #d49441;
    --accent-deep: #5e3d1d;
    --accent-soft: rgba(212, 148, 65, 0.14);
    --done: #7da276;
    --done-bg: rgba(125, 162, 118, 0.12);
    --field: #15120f;
    --shadow: 0 18px 40px rgba(0,0,0,0.24);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at top, rgba(212,148,65,0.12), transparent 36%),
      linear-gradient(180deg, #14120f 0%, #13110f 100%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    padding:18px 14px 34px;
  }

  .wrap{
    width:min(760px, 100%);
    margin:0 auto;
  }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom:16px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
  }

  h1{
    font-family:'Oswald', sans-serif;
    font-size:34px;
    line-height:0.95;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }

  .top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .nav-link,
  .ghost-btn,
  .mini-btn{
    appearance:none;
    background:var(--bg-card);
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:999px;
    text-decoration:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:10px 12px;
    cursor:pointer;
    transition:border-color 0.15s, color 0.15s, background 0.15s;
  }

  .nav-link:hover,
  .ghost-btn:hover,
  .mini-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  .quote-card,
  .panel,
  .exercise-card,
  .session-panel,
  .conditioning-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
  }

  .quote-card{
    padding:18px;
    margin-bottom:16px;
  }

  .quote-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
    margin-bottom:14px;
  }

  .quote-label,
  .section-label,
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .quote-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }

  blockquote{
    font-family:'Oswald', sans-serif;
    font-size:26px;
    line-height:1.06;
    text-transform:uppercase;
    max-width:14ch;
  }

  .quote-author{
    margin-top:14px;
    color:var(--text-dim);
    font-size:14px;
  }

  .tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 1px 10px;
    margin:0 -2px 14px;
    scrollbar-width:none;
  }

  .tabs::-webkit-scrollbar{ display:none; }

  .tab{
    flex:0 0 auto;
    min-width:138px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 12px 11px;
    text-align:left;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s, transform 0.15s;
    -webkit-tap-highlight-color:transparent;
  }

  .tab.active{
    background:linear-gradient(180deg, rgba(212,148,65,0.22), rgba(94,61,29,0.42));
    border-color:var(--accent);
  }

  .tab:active{ transform:scale(0.99); }

  .tab .num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .tab.active .num{ color:var(--accent); }

  .tab .name{
    margin-top:5px;
    font-family:'Oswald', sans-serif;
    font-size:16px;
    text-transform:uppercase;
    line-height:1.05;
  }

  .tab .focus{
    margin-top:4px;
    color:var(--text-dim);
    font-size:11px;
    line-height:1.35;
  }

  .panel{
    padding:16px;
    margin-bottom:16px;
  }

  .meta-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom:14px;
  }

  .meta-title{
    font-family:'Oswald', sans-serif;
    font-size:24px;
    line-height:1;
    text-transform:uppercase;
  }

  .meta-focus{
    margin-top:6px;
    color:var(--text-dim);
    font-size:13px;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    border:1px solid var(--line);
    background:var(--bg-elevated);
    border-radius:999px;
    padding:7px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
  }

  .chip strong{
    color:var(--accent);
    margin-right:6px;
    font-weight:700;
  }

  .stack{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .exercise-card{
    padding:14px;
  }

  .exercise-card.done{
    background:linear-gradient(180deg, rgba(125,162,118,0.14), rgba(125,162,118,0.06));
    border-color:#3d5537;
  }

  .exercise-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
  }

  .exercise-name{
    font-family:'Oswald', sans-serif;
    font-size:19px;
    text-transform:uppercase;
    line-height:1.02;
  }

  .exercise-target{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--accent);
    white-space:nowrap;
  }

  .exercise-note{
    margin-top:8px;
    color:var(--text-dim);
    font-size:13px;
    line-height:1.45;
  }

  .exercise-stats{
    margin-top:12px;
    display:flex;
    gap:10px;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:8px 10px;
    background:var(--accent-soft);
    color:var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
  }

  .status-pill.complete{
    background:var(--done-bg);
    color:#d3e6cf;
  }

  .exercise-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .set-list{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .set-row{
    background:rgba(0,0,0,0.14);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
  }

  .set-row.done{
    border-color:#3d5537;
    background:rgba(125,162,118,0.1);
  }

  .set-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }

  .set-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
  }

  .set-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .field,
  .field-textarea{
    width:100%;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    padding:11px 12px;
    outline:none;
    font:inherit;
    transition:border-color 0.15s, background 0.15s;
  }

  .field:focus,
  .field-textarea:focus{
    border-color:var(--accent);
    background:#1b1712;
  }

  .field::placeholder,
  .field-textarea::placeholder{
    color:var(--text-faint);
  }

  .field-textarea{
    min-height:84px;
    resize:vertical;
    line-height:1.5;
  }

  .check-wrap{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--bg-elevated);
  }

  .check-input{
    width:18px;
    height:18px;
    accent-color:var(--done);
  }

  .check-copy{
    font-size:12px;
    color:var(--text-dim);
  }

  .set-note,
  .exercise-comment{
    margin-top:10px;
  }

  .session-panel,
  .conditioning-card{
    padding:16px;
  }

  .section-title{
    font-family:'Oswald', sans-serif;
    font-size:18px;
    text-transform:uppercase;
    margin-bottom:12px;
  }

  .conditioning-stack{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .conditioning-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(212,148,65,0.03));
  }

  .conditioning-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }

  .conditioning-name{
    font-family:'Oswald', sans-serif;
    font-size:20px;
    text-transform:uppercase;
  }

  .conditioning-target{
    font-family:'JetBrains Mono', monospace;
    color:var(--accent);
    font-size:11px;
  }

  .progress-wrap{
    margin-top:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .bar{
    flex:1;
    height:8px;
    background:var(--bg-elevated);
    border-radius:999px;
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--done), #a1c093);
    transition:width 0.2s ease;
  }

  .progress-text{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .footer-row{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
  }

  .hidden{ display:none; }

  @media (min-width: 700px){
    body{ padding:28px 18px 40px; }
    .quote-card{ padding:22px; }
    blockquote{ font-size:34px; }
    .set-grid{
      grid-template-columns:1fr 1fr auto;
      align-items:end;
    }
    .set-note{
      display:grid;
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="eyebrow">Static · Local Only</div>
      <h1>Training Log</h1>
    </div>
    <div class="top-actions">
      <a class="nav-link" href="./workout-stats.html">Stats</a>
    </div>
  </header>

  <section class="quote-card">
    <div class="quote-top">
      <div class="quote-label">Quote Deck</div>
      <div class="quote-actions">
        <button class="ghost-btn" id="randomQuoteBtn" type="button">Random</button>
        <button class="ghost-btn" id="nextQuoteBtn" type="button">Next</button>
      </div>
    </div>
    <blockquote id="quoteText"></blockquote>
    <div class="quote-author" id="quoteAuthor"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Workout views"></nav>

  <section class="panel" id="dayPanel">
    <div class="meta-row">
      <div>
        <div class="section-label">Current Session</div>
        <div class="meta-title" id="metaTitle"></div>
        <div class="meta-focus" id="metaFocus"></div>
      </div>
    </div>
    <div class="chip-row">
      <div class="chip"><strong id="metaCount"></strong> exercises</div>
      <div class="chip"><strong id="metaSets"></strong> planned sets</div>
      <div class="chip"><strong id="metaDone"></strong> logged sets</div>
    </div>
  </section>

  <section class="hidden" id="dayView">
    <div class="stack" id="exList"></div>

    <section class="session-panel">
      <div class="section-title">Session Notes</div>
      <label class="field-label" for="sessionComment">Day note</label>
      <textarea class="field-textarea" id="sessionComment" placeholder="Energy, adjustments, pain, wins."></textarea>
    </section>

    <section class="panel progress-wrap">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="progress-text" id="progressText">0 / 0 sets logged</div>
    </section>

    <div class="footer-row">
      <button class="ghost-btn" id="resetBtn" type="button">Reset Day</button>
    </div>
  </section>

  <section class="hidden" id="conditioningView">
    <div class="panel">
      <div class="section-label">Separate Tab</div>
      <div class="section-title" style="margin-top:6px; margin-bottom:0;">Conditioning</div>
    </div>
    <div class="conditioning-stack" id="conditioning"></div>
  </section>
</div>

<script src="./workout-log/data.js"></script>
<script src="./workout-log/quotes.js"></script>
<script src="./workout-log/app.js"></script>
</body>
</html>
